# OBS Edit Transform presets for the 4K Cam Link clones (canvas 1920x1080, source 3840x2160, PAL 25 fps, lens 16mm F3.5)
# Crop values are SOURCE pixels. Bounds: Cover, 1920x1080, Position 0,0, Crop Bounds ticked, Lanczos filtering.
clones:
  before_playing: "[CLONE] CLOSEUP CLEAN 2 2"   # colour, head close-up
  during_playing: "[CLONE] CLOSEUP CLEAN 2"     # black and white, bass visible
user_final_v1_5_4:            # entered by the user, LEDs land on both edges (checked from screenshots)
  before_playing: {left: 1010, right: 1250, top: 1130, bottom: 95}   # visible 1580x935 (not exactly 16:9)
  during_playing: {left: 1010, right: 1250, top: 1032, bottom: 210}  # visible 1580x918 (not exactly 16:9)
exact_16_9_equivalent:        # same picture, but numbers match what Cover really shows (1580x889): optional tidy-up
  before_playing: {left: 1010, right: 1250, top: 1153, bottom: 118}
  during_playing: {left: 1010, right: 1250, top: 1047, bottom: 225}
note_cover: with Cover, a window that is slightly less wide-screen than 16:9 is scaled to fill the width and the extra height is trimmed
  equally from top and bottom, so the real picture equals the 'exact_16_9_equivalent' numbers.
alt_lens_18mm_not_repeatable_after_power_off:
  before_playing: {left: 889, right: 1191, top: 1157, bottom: 13}
  during_playing: {left: 869, right: 1176, top: 1027, bottom: 123}
vertical_canvas_1080x1920:     # [CLONE] Upload Cam in the Vertical scene (starting values, untested)
  edit_transform: {position: [0, 0], bounds: Cover, bounds_size: [1080, 1920], crop_bounds: true}
  full_height_9_16: {left: 1020, right: 1605, top: 0, bottom: 0}     # visible 1215x2160, scale 0.889
  without_led_stripe: {left: 1070, right: 1555, top: 0, bottom: 0}
  tighter_no_ceiling: {left: 1020, right: 1746, top: 250, bottom: 0} # visible 1074x1910
  rule: left + right = 3840 - (2160 - top - bottom) * 9 / 16
  user_tried_v1_5_5: {left: 1020, right: 1605, top: 250, bottom: 0}  # 1215x1910; Cover trims to real L1090 R1676 T250 B0
  match_shorts_reference_v1_5_6: {left: 1145, right: 1761, top: 465, bottom: 34}  # visible 934x1661, ~1.15x tighter, measured on glasses/face width
  user_final_v1_5_7: {left: 800, right: 1270, top: 660, bottom: 50}   # 1770x1450 window, Cover trims 477 px per side
  user_final_v1_5_7_exact_9_16: {left: 1277, right: 1747, top: 660, bottom: 50}   # visible 816x1450, upscale 1.324x, same picture
